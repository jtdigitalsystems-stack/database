    <!-- AUTHENTICATED USER + FACILITY CONTEXT -->
    <script>
        async function loadHubContextData() {
            const userTag = document.getElementById('user-display-name');
            const navLabel = document.getElementById('nav-facility-name');
            const heroLabel = document.getElementById('hero-facility-name');

            try {
                // Both endpoints are protected by the Flask staff session.
                const [staffResponse, facilityResponse] = await Promise.all([
                    fetch('/api/staff/me', {
                        method: 'GET',
                        credentials: 'same-origin',
                        cache: 'no-store'
                    }),
                    fetch('/api/firebase-config', {
                        method: 'GET',
                        credentials: 'same-origin',
                        cache: 'no-store'
                    })
                ]);

                if (staffResponse.status === 401 || facilityResponse.status === 401) {
                    window.location.href = '{{ url_for("login_page") }}';
                    return;
                }

                if (!staffResponse.ok || !facilityResponse.ok) {
                    throw new Error('Unable to resolve authenticated staff context.');
                }

                const staffData = await staffResponse.json();
                const facilityData = await facilityResponse.json();

                if (!staffData.success || !facilityData.success) {
                    throw new Error('Invalid authenticated context.');
                }

                const staffName = String(
                    staffData.staff?.name || 'Clinical Staff'
                ).trim();

                const facilityName = String(
                    facilityData.facility_name || 'Facility'
                ).trim();

                if (userTag) {
                    userTag.innerText = `Welcome back, ${staffName}`;
                }

                if (navLabel) {
                    navLabel.innerText = `${facilityName} Client Database`;
                }

                if (heroLabel) {
                    heroLabel.innerText = `${facilityName} Client Database`;
                }

            } catch (error) {
                console.error('Failed to load authenticated hub context:', error);

                if (userTag) {
                    userTag.innerText = 'Welcome back, Clinical Staff';
                }

                if (navLabel) {
                    navLabel.innerText = 'Client Database';
                }

                if (heroLabel) {
                    heroLabel.innerText = 'Client Database';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadHubContextData);
    </script>

</html>
