<!-- NAVBAR METADATA -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    /* Initialize Lucide icons */
    if (window.lucide) {
        lucide.createIcons();
    }

    /* Staff name */
    const savedName = localStorage.getItem("user_name");

    if (savedName) {
        const nameEl = document.getElementById("nav-user-name");

        if (nameEl) {
            nameEl.textContent = savedName;
        }
    }

    /* Staff clearance */
    const savedClearance = localStorage.getItem("user_clearance");

    if (savedClearance) {
        const roleEl = document.getElementById("nav-user-role");

        if (roleEl) {
            roleEl.textContent = `Clearance: ${savedClearance}`;
        }
    }

    /* Facility name */
    const savedFacilityName =
        localStorage.getItem("facility_name");

    if (savedFacilityName) {
        const facilityEl =
            document.getElementById("nav-facility-name");

        if (facilityEl) {
            facilityEl.textContent = savedFacilityName;
        }
    }

});
</script>
